<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股Tube</title>
<meta name="description" content="PTT 股票板鄉民一直互相推薦的 YouTube 影片">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1b1a17; --muted:#6d685e; --line:#e3ded3;
  --up:#d6282e; --down:#13874c; --accent:#d6282e; --chip:#efebe2; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --panel:#1c1b1a; --ink:#f1eee8; --muted:#a29d93; --line:#2f2d2a;
    --up:#ff5a5f; --down:#3ccf7d; --accent:#ff5a5f; --chip:#262422; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --panel:#1c1b1a; --ink:#f1eee8; --muted:#a29d93; --line:#2f2d2a;
  --up:#ff5a5f; --down:#3ccf7d; --accent:#ff5a5f; --chip:#262422; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.5}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:12px;padding:12px 0}
.logo{font-weight:900;font-size:22px;letter-spacing:.5px;text-decoration:none;white-space:nowrap}
.logo b{color:var(--accent)}
.tag{color:var(--muted);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.theme{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.ticker{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding:6px 0;display:flex;gap:18px;overflow-x:auto;white-space:nowrap}
.ticker span b{color:var(--up)}
nav.tabs{display:flex;gap:4px;padding:14px 0 6px;overflow-x:auto}
nav.tabs button{border:none;background:none;color:var(--muted);font:inherit;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:var(--ink);color:var(--bg)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:6px 0 12px}
.tools input{flex:1;min-width:180px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding-bottom:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.thumb{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer;border:0;padding:0;display:block;width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rank{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.72);color:#fff;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12px;padding:2px 7px;border-radius:6px}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);color:#fff;font-size:12px;padding:1px 6px;border-radius:4px;font-family:"JetBrains Mono",monospace}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.title{font-weight:700;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.ch{color:var(--muted);font-size:13px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;margin-top:auto}
.pill{background:var(--chip);border-radius:6px;padding:1px 7px;color:var(--muted)}
.hot{color:var(--up);font-weight:700;font-family:"JetBrains Mono",monospace}
.acts{display:flex;gap:6px;margin-top:6px}
.acts button,.acts a{flex:1;text-align:center;font-size:12px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:5px 4px;cursor:pointer;text-decoration:none;font-family:inherit}
.acts .on{background:var(--ink);color:var(--bg)}
.card.watched{opacity:.55}
.more{display:block;margin:0 auto 32px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 26px;font:inherit;font-weight:700;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:60px 0}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px;padding:18px 0 30px}
dialog{border:none;border-radius:14px;padding:0;max-width:880px;width:calc(100% - 24px);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.player{aspect-ratio:16/9;background:#000}
.player iframe{width:100%;height:100%;border:0;display:block}
.dbody{padding:14px 16px 18px}
.dbody h3{margin:0 0 4px;font-size:17px}
.dbody ul{list-style:none;padding:0;margin:10px 0 0;max-height:220px;overflow:auto}
.dbody li{border-top:1px solid var(--line);padding:7px 0;font-size:14px;display:flex;gap:8px}
.dbody li .n{font-family:"JetBrains Mono",monospace;min-width:34px;color:var(--up);font-weight:700}
.dbody li a{text-decoration:none}
.dbody li a:hover{text-decoration:underline}
.close{float:right;border:none;background:var(--chip);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <a class="logo" href="./">台股<b>Tube</b></a>
      <div class="tag">PTT 股票板鄉民一直互相推薦的 YouTube 影片</div>
      <button class="theme" id="theme" aria-label="切換深淺色">深／淺</button>
    </div>
    <div class="ticker" id="ticker"></div>
  </div>
</header>

<main class="wrap">
  <nav class="tabs" id="tabs">
    <button data-tab="hot" class="on">🔥 熱門</button>
    <button data-tab="new">🆕 最新</button>
    <button data-tab="long">⏳ 長片</button>
    <button data-tab="later">🔖 稍後觀看</button>
    <button data-tab="watched">✔ 已看過</button>
  </nav>
  <div class="tools">
    <input id="q" type="search" placeholder="搜尋標題或頻道，例如：台積電、ETF、存股">
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>載入更多</button>
</main>

<footer>
  <div class="wrap">
    資料來源：PTT 股票板（Stock）文章與推文中分享的 YouTube 連結，自動每天更新。最後更新：<span id="updated"></span><br>
    本站只整理鄉民分享的影片，內容不代表本站立場，<b>不構成任何投資建議</b>，投資請自行判斷風險。
  </div>
</footer>

<dialog id="dlg">
  <div class="player" id="player"></div>
  <div class="dbody">
    <button class="close" id="close">關閉</button>
    <h3 id="dtitle"></h3>
    <div class="ch" id="dch"></div>
    <ul id="dlist"></ul>
  </div>
</dialog>

<script>
const DATA = [];
const UPDATED = "2026/11/04 23:33";

const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)) || []; }catch(e){ return []; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let later = new Set(store.get("later")), watched = new Set(store.get("watched"));
let state = {tab:"hot", q:"", cat:"全部", shown:60};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDur = s => { if(!s) return ""; const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (h? h+":"+String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };
const fmtDate = iso => iso ? iso.slice(0,10).replaceAll("-","/") : "";
const hasDur = DATA.some(v => v.duration);

// 主題
try{ const t = localStorage.getItem("theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem("theme", next); }catch(e){}
};

// 跑馬燈：前五名
$("ticker").innerHTML = DATA.slice(0,6).map((v,i) =>
  `<span>#${i+1} ${esc(v.title.slice(0,18))}${v.title.length>18?"…":""} <b>▲${v.mentions.length}</b></span>`).join("")
  || "<span>資料準備中</span>";
$("updated").textContent = UPDATED;
if(!hasDur) document.querySelector('[data-tab="long"]').hidden = true;

// 分類
const cats = {};
DATA.forEach(v => cats[v.category] = (cats[v.category]||0) + 1);
const catList = ["全部", ...Object.keys(cats).sort((a,b)=>cats[b]-cats[a]).slice(0,12)];
function drawChips(){
  $("chips").innerHTML = catList.map(c =>
    `<button class="chip ${c===state.cat?"on":""}" data-cat="${esc(c)}">${esc(c)}${c==="全部"?"":" "+cats[c]}</button>`).join("");
}

function list(){
  let arr = DATA.slice();
  if(state.tab==="new") arr.sort((a,b)=> b.last_seen.localeCompare(a.last_seen));
  if(state.tab==="long") arr = arr.filter(v => v.duration >= 1200);
  if(state.tab==="later") arr = arr.filter(v => later.has(v.id));
  if(state.tab==="watched") arr = arr.filter(v => watched.has(v.id));
  if(state.cat!=="全部") arr = arr.filter(v => v.category===state.cat);
  if(state.q){ const q = state.q.toLowerCase();
    arr = arr.filter(v => (v.title+" "+(v.channel||"")+" "+v.mentions.map(m=>m.title).join(" ")).toLowerCase().includes(q)); }
  return arr;
}

function card(v){
  const rank = DATA.indexOf(v) + 1;
  return `<article class="card ${watched.has(v.id)?"watched":""}">
    <button class="thumb" data-play="${v.id}" aria-label="播放 ${esc(v.title)}">
      <img loading="lazy" onerror="this.style.visibility='hidden'" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="">
      <span class="rank">#${rank}</span>
      ${v.duration?`<span class="dur">${fmtDur(v.duration)}</span>`:""}
    </button>
    <div class="body">
      <div class="title" data-play="${v.id}">${esc(v.title)}</div>
      <div class="ch">${esc(v.channel||"")}</div>
      <div class="meta">
        <span class="hot">▲ ${v.mentions.length} 篇推薦</span>
        <span class="pill">${esc(v.category)}</span>
        <span class="pill">${fmtDate(v.last_seen)}</span>
      </div>
      <div class="acts">
        <button data-later="${v.id}" class="${later.has(v.id)?"on":""}">${later.has(v.id)?"已加入":"稍後觀看"}</button>
        <button data-watched="${v.id}" class="${watched.has(v.id)?"on":""}">${watched.has(v.id)?"已看過":"標記已看"}</button>
        <a href="${esc(v.mentions[v.mentions.length-1].url)}" target="_blank" rel="noopener">鄉民怎麼說</a>
      </div>
    </div>
  </article>`;
}

function draw(){
  drawChips();
  const arr = list();
  $("grid").innerHTML = arr.slice(0, state.shown).map(card).join("") ||
    `<div class="empty">${state.tab==="later"?"還沒有加入稍後觀看的影片":state.tab==="watched"?"還沒有看過的影片":"找不到符合的影片"}</div>`;
  $("grid").style.display = arr.length ? "grid" : "block";
  $("more").hidden = arr.length <= state.shown;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-cat],[data-play],[data-later],[data-watched]");
  if(!t) return;
  if(t.dataset.tab){ state.tab=t.dataset.tab; state.shown=60;
    document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b===t)); draw(); }
  else if(t.dataset.cat){ state.cat=t.dataset.cat; state.shown=60; draw(); }
  else if(t.dataset.play){ openPlayer(t.dataset.play); }
  else if(t.dataset.later){ const id=t.dataset.later; later.has(id)?later.delete(id):later.add(id); store.set("later",[...later]); draw(); }
  else if(t.dataset.watched){ const id=t.dataset.watched; watched.has(id)?watched.delete(id):watched.add(id); store.set("watched",[...watched]); draw(); }
});
$("q").addEventListener("input", e => { state.q=e.target.value.trim(); state.shown=60; draw(); });
$("more").onclick = () => { state.shown += 60; draw(); };

function openPlayer(id){
  const v = DATA.find(x => x.id===id); if(!v) return;
  $("player").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  $("dtitle").textContent = v.title;
  $("dch").textContent = (v.channel||"") + " ・ 被 " + v.mentions.length + " 篇文章推薦";
  $("dlist").innerHTML = v.mentions.slice().reverse().map(m =>
    `<li><span class="n">${m.nrec>=100?"爆":m.nrec}</span><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a></li>`).join("");
  $("dlg").showModal();
  if(!watched.has(id)){ watched.add(id); store.set("watched",[...watched]); }
}
function closePlayer(){ $("player").innerHTML=""; $("dlg").close(); draw(); }
$("close").onclick = closePlayer;
$("dlg").addEventListener("click", e => { if(e.target===$("dlg")) closePlayer(); });
$("dlg").addEventListener("cancel", () => { $("player").innerHTML=""; setTimeout(draw); });

draw();
</script>
</body>
</html>
