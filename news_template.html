<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股新聞牆</title>
<meta name="description" content="台股、美股新聞與投資部落格標題，一頁看完">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1b1a17; --muted:#6d685e; --line:#e3ded3;
  --accent:#d6282e; --chip:#efebe2; --row:#faf8f4; --link:#1f4fbf; --visited:#7b4fa8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --panel:#1c1b1a; --ink:#f1eee8; --muted:#a29d93; --line:#2f2d2a;
    --accent:#ff5a5f; --chip:#262422; --row:#201f1d; --link:#8fb4ff; --visited:#c5a3ef;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --panel:#1c1b1a; --ink:#f1eee8; --muted:#a29d93; --line:#2f2d2a;
  --accent:#ff5a5f; --chip:#262422; --row:#201f1d; --link:#8fb4ff; --visited:#c5a3ef;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:12px;padding:12px 0}
.logo{font-weight:900;font-size:22px;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo b{color:var(--accent)}
.tag{color:var(--muted);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px;text-decoration:none;white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 0 10px}
.tools input{flex:1;min-width:180px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:16px;padding-bottom:28px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.col h2{margin:0;font-size:15px;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.col h2 span{color:var(--muted);font-weight:500;font-size:12px}
.day{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;color:var(--muted);background:var(--chip);padding:4px 14px}
.row{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:6px 14px;border-top:1px solid var(--line);font-size:14px}
.row:nth-child(even){background:var(--row)}
.time{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);padding-top:2px}
.row a{color:var(--link);text-decoration:none}
.row a:visited{color:var(--visited)}
.row a:hover{text-decoration:underline}
.src{color:var(--muted);font-size:12px;margin-left:6px;white-space:nowrap}
.new{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle}
.empty{color:var(--muted);padding:30px 14px;text-align:center}
.more{display:block;width:100%;border:none;border-top:1px solid var(--line);background:none;color:var(--ink);padding:10px;font:inherit;font-weight:700;cursor:pointer}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px;padding:18px 0 30px}
</style>
</head>
<body>
<header>
  <div class="wrap"><div class="top">
    <a class="logo" href="./news.html">台股<b>新聞牆</b></a>
    <div class="tag">台股、美股新聞與投資部落格標題，一頁看完</div>
    <a class="btn" href="./">🎬 台股Tube</a>
    <button class="btn" id="theme" aria-label="切換深淺色">深／淺</button>
  </div></div>
</header>

<main class="wrap">
  <div class="tools">
    <input id="q" type="search" placeholder="搜尋標題或來源，例如：台積電、費半、ETF">
  </div>
  <div class="chips" id="chips"></div>
  <div class="cols" style="margin-top:12px">
    <section class="col"><h2>📰 新聞 <span id="nCount"></span></h2><div id="news"></div></section>
    <section class="col"><h2>✍️ 部落格 <span id="bCount"></span></h2><div id="blogs"></div></section>
  </div>
</main>

<footer>
  <div class="wrap">
    只列出各媒體與部落格公開 RSS 的標題，點進去會連到原網站閱讀，版權屬於原作者與媒體。最後更新：<span id="updated"></span><br>
    內容不代表本站立場，<b>不構成任何投資建議</b>。
  </div>
</footer>

<script>
const DATA = __DATA__;
const UPDATED = "__UPDATED__";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state = {q:"", tag:"全部", shown:{news:150, blogs:80}};

try{ const t = localStorage.getItem("theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem("theme", next); }catch(e){}
};
$("updated").textContent = UPDATED;

const tags = ["全部", ...new Set(DATA.news.map(n => n.tag).filter(Boolean))];
function drawChips(){
  $("chips").innerHTML = tags.map(t => `<button class="chip ${t===state.tag?"on":""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("");
}

const now = Date.now();
function dayLabel(d){
  const today = new Date(); today.setHours(0,0,0,0);
  const x = new Date(d); x.setHours(0,0,0,0);
  const diff = Math.round((today - x) / 864e5);
  const md = `${x.getMonth()+1}/${x.getDate()}`;
  return diff === 0 ? `今天 ${md}` : diff === 1 ? `昨天 ${md}` : md;
}

function render(key, list){
  const q = state.q.toLowerCase();
  let arr = list.filter(it => (key==="blogs" || state.tag==="全部" || it.tag===state.tag) &&
    (!q || (it.title + " " + it.source).toLowerCase().includes(q)));
  $(key==="news" ? "nCount" : "bCount").textContent = arr.length + " 則";
  const shown = arr.slice(0, state.shown[key]);
  let html = "", lastDay = "";
  for(const it of shown){
    const d = new Date(it.time), label = dayLabel(d);
    if(label !== lastDay){ html += `<div class="day">${label}</div>`; lastDay = label; }
    const hh = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    const fresh = now - d.getTime() < 3600e3 ? '<span class="new" title="一小時內"></span>' : "";
    html += `<div class="row"><span class="time">${hh}</span><span>${fresh}<a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}</a><span class="src">${esc(it.source)}</span></span></div>`;
  }
  if(!shown.length) html = `<div class="empty">目前沒有符合的內容</div>`;
  if(arr.length > shown.length) html += `<button class="more" data-more="${key}">再看 ${Math.min(100, arr.length - shown.length)} 則</button>`;
  $(key).innerHTML = html;
}
function draw(){ drawChips(); render("news", DATA.news); render("blogs", DATA.blogs); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tag],[data-more]"); if(!t) return;
  if(t.dataset.tag){ state.tag = t.dataset.tag; draw(); }
  else { state.shown[t.dataset.more] += 100; draw(); }
});
$("q").addEventListener("input", e => { state.q = e.target.value.trim(); draw(); });
draw();
</script>
</body>
</html>
