name: 更新台股Tube

on:
  schedule:
    - cron: "17 23,5,11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 抓 PTT 股票板
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PTT_PAGES: "40"
        run: python scraper.py

      - name: 產生網站
        run: python build_site.py

      - name: 存回儲存庫
        run: |
          git config user.name "stocktube-bot"
          git config user.email "stocktube-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "自動更新 $(date -u +'%Y-%m-%d %H:%M')"
          git push
